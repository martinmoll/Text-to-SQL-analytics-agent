name: CI

# Two-tier design:
#   - Deterministic tier (unit tests + resolution-only evals): free, fast,
#     no LLM calls — runs automatically on every push and PR. A red X here
#     always means something real broke.
#   - LLM tier (full agent evals): costs API credits and has run-to-run
#     sampling variance — triggered manually from the Actions tab
#     (workflow_dispatch). Requires the ANTHROPIC_API_KEY repository secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Run unit tests
        run: python -m pytest tests/ -v

  eval-resolution:
    name: Semantic Resolution Evals (deterministic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Run resolution-only evals
        run: python -m evals.run_evals --no-llm --verbose --save

      - name: Check for regressions vs committed baseline
        run: |
          CANDIDATE=$(ls evals/results/eval_*.json | sort | tail -1)
          echo "Comparing baseline resolution_baseline.json -> $CANDIDATE"
          python -m evals.ablation evals/results/resolution_baseline.json "$CANDIDATE" --fail-on-regression

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-resolution
          path: evals/results/

  eval-full:
    name: Full Agent Evals (manual — uses API credits)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest test data
        run: python data/ingestion/ingest_prices.py

      - name: Run full evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BASELINE=$(ls evals/results/eval_*.json | sort | tail -1)
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
          python -m evals.run_evals --verbose --save

      - name: Check for regressions vs committed baseline
        run: |
          CANDIDATE=$(ls evals/results/eval_*.json | sort | tail -1)
          echo "Comparing baseline $BASELINE -> $CANDIDATE"
          python -m evals.ablation "$BASELINE" "$CANDIDATE" --fail-on-regression

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-full
          path: evals/results/
