[project]
name = "text-to-sql-analytics-agent"
version = "0.1.0"
description = "Agentic text-to-SQL system for financial analytics with governed semantic layer, LLM skill routing, and adversarial validation"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "yfinance>=0.2.40",
    "anthropic>=0.30.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
